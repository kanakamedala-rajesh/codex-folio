name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux AMD64
            runner: ubuntu-latest
          - target: Windows AMD64
            runner: windows-latest
          - target: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            .tool-versions
      - name: Install the pinned Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            .nvmrc
      - name: Prepare an ephemeral user Keychain for native tests
        if: matrix.runner == 'macos-15'
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/codex-folio-ci.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          echo "::add-mask::$keychain_password"
          echo "CODEX_FOLIO_TEST_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
      - name: Run the repository verification contract
        run: node scripts/verify.mjs
