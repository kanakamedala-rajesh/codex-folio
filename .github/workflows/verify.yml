name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Repository verification (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux AMD64
            runner: ubuntu-latest
          - target: Windows AMD64
            runner: windows-latest
          - target: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            .tool-versions
      - name: Install the pinned Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            .nvmrc
      - name: Prepare an ephemeral user Keychain for native tests
        if: matrix.runner == 'macos-15'
        shell: bash
        run: |
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          platform_keychain_path="$RUNNER_TEMP/codex-folio-platform.keychain-db"
          cmd_keychain_path="$RUNNER_TEMP/codex-folio-cmd.keychain-db"
          for keychain_path in "$platform_keychain_path" "$cmd_keychain_path"; do
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
          done
          security list-keychains -d user -s "$platform_keychain_path" "$cmd_keychain_path"
          security default-keychain -d user -s "$platform_keychain_path"
          echo "CODEX_FOLIO_TEST_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          echo "CODEX_FOLIO_PLATFORM_KEYCHAIN_PATH=$platform_keychain_path" >> "$GITHUB_ENV"
          echo "CODEX_FOLIO_CMD_KEYCHAIN_PATH=$cmd_keychain_path" >> "$GITHUB_ENV"
      - name: Run the repository verification contract
        env:
          # The file-based Keychain's default/search-list preferences are
          # shared by the macOS test processes. Keep native packages from
          # overwriting one another's test Keychain configuration.
          GOFLAGS: ${{ matrix.runner == 'macos-15' && '-p=1' || '' }}
        run: node scripts/verify.mjs --suite native

  web:
    name: Web UI and startup benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_FOLIO_BROWSER_OUTPUT: ${{ github.workspace }}/build/browser-evidence
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run shared web verification and serial startup benchmark
        run: node scripts/verify.mjs --suite web
      - name: Record startup benchmark evidence
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            import { join } from "node:path";
            const result = join(process.env.CODEX_FOLIO_BROWSER_OUTPUT, "startup-benchmark.json");
            if (existsSync(result)) appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### Startup benchmark\n\n```json\n" + readFileSync(result, "utf8") + "\n```\n");
          '
